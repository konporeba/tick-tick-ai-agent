- scenario: "long_description_brevity"
  raw:
    project_id: "proj_eval"
    task_id: "eval_008"
    title: "Migrate legacy authentication service"
    description: "The legacy authentication service was originally built in 2018 and uses a custom JWT implementation that has since been superseded by the standard library approach we now use everywhere else in the codebase. It also has some hardcoded secrets which is a security concern that was raised in the last audit. We need to rewrite it to use the standard auth library, remove the hardcoded secrets and move them to the secrets manager, update all the downstream services that depend on the old auth service to use the new endpoints, write migration tests to make sure nothing breaks during the cutover, coordinate with the DevOps team for the deployment window, update the API docs, and then monitor for errors for 48 hours post-deployment. There's also a question of whether we should do a gradual rollout or a hard cutover — that decision needs to be made with the team lead before we start coding."
    priority: 5
    tags:
      - work
  expected:
    project_id: "proj_eval"
    task_id: "eval_008"
    title: "🔐 Migrate legacy authentication service"
    description: |
      Rewrite the legacy auth service (built 2018, custom JWT) to use the standard auth library.
      Key steps: (1) move hardcoded secrets to secrets manager, (2) update downstream service
      endpoints, (3) write migration tests, (4) coordinate deployment window with DevOps, (5)
      update API docs, (6) monitor 48h post-deploy. Discuss gradual rollout vs. hard cutover
      with team lead before starting.

      ---
      *authentication • migration • security • work*
    priority: 5
    tags:
      - work
    reasoning: "Condensed 500+ char description to structured numbered steps preserving all key details. Priority 5 preserved (security concern + user-set). Added security tag alongside work."

