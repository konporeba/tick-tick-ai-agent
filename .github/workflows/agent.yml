name: TickTick AI Agent

on:
  schedule:
    - cron: '*/15 4-21 * * *'  # Every 15 min, 06:00-23:45 Polish summer / 05:00-22:45 Polish winter
  workflow_dispatch:           # Manual trigger for testing

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # Needed for the keep-alive commit step

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Keep-alive commit (defeats 60-day dormancy auto-disable)
        if: github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_run
          git diff --quiet --cached || git commit -m "keep-alive"
          git push

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
